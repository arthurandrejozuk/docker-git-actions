name: "Contrução do artefato"
on: 
  push: 
    branches: ["main", "secondary"]
# adas
jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build docker image
        run: docker build --target=production -t arthurandrejozuk/docker-git-actions${{github.sha}} .

      - name: Projeto compilado
        uses: actions/upload-artifact@v4
        with:
          name: projeto_compilado
          path: main
