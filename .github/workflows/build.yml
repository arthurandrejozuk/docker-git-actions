name: "Construção do artefato"

on: 
  push: 
    branches: ["main", "secondary"]

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: arthurandrejozuk
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            arthurandrejozuk/docker-git-actions:latest
            arthurandrejozuk/docker-git-actions:${{ github.sha }}

      - name: Upload do artefato compilado
        uses: actions/upload-artifact@v4
        with:
          name: projeto_compilado
          path: ./main